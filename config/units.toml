[build]
compiler = "msvc5.0"
platform = "win32"

# Exact Gruntz profile schema under the selected SP2 payload. These complete
# profiles remain calibration candidates until per-TU witnesses select flags.
[flags]
c             = ["/nologo", "/c", "/O2", "/MT"]
cpp           = ["/nologo", "/c", "/O2", "/MT", "/GX"]
cpp-rtti      = ["/nologo", "/c", "/O2", "/MT", "/GX", "/GR"]
cpp-rtti-noeh = ["/nologo", "/c", "/O2", "/MT", "/GR"]
cpp-noeh      = ["/nologo", "/c", "/O2", "/MT"]
cpp-od        = ["/nologo", "/c", "/Od", "/MT", "/GX"]
cpp-od-noeh   = ["/nologo", "/c", "/Od", "/MT"]

[[unit]]
unit = "smackerplayer"
source = "src/Video/SmackerPlayer.cpp"
flags = "cpp"

