[build]
compiler = "msvc5.0"
platform = "win32"

# Exact Gruntz profile schema under the selected SP2 payload. These complete
# profiles remain calibration candidates until per-TU witnesses select flags.
[flags]
c             = ["/nologo", "/c", "/O2", "/MT"]
cpp           = ["/nologo", "/c", "/O2", "/MT", "/GX"]
cpp-rtti      = ["/nologo", "/c", "/O2", "/MT", "/GX", "/GR"]
cpp-rtti-noeh = ["/nologo", "/c", "/O2", "/MT", "/GR"]
cpp-noeh      = ["/nologo", "/c", "/O2", "/MT"]
cpp-od        = ["/nologo", "/c", "/Od", "/MT", "/GX"]
cpp-od-noeh   = ["/nologo", "/c", "/Od", "/MT"]

[[unit]]
unit = "smackerplayer"
source = "src/Video/SmackerPlayer.cpp"
flags = "cpp"

[[unit]]
unit = "scenarioconfig"
source = "src/Scenario/ScenarioConfig.cpp"
flags = "cpp"

[[unit]]
unit = "butemgr"
source = "src/Bute/ButeMgr.cpp"
flags = "cpp"

[[unit]]
unit = "ddrawglobals"
source = "src/DDraw/DDrawGlobals.cpp"
flags = "cpp-noeh"

[[unit]]
unit = "wordrle"
source = "src/Codec/WordRle.cpp"
flags = "cpp-od"

[[unit]]
unit = "wordrletokens"
source = "src/Codec/WordRleTokens.cpp"
flags = "cpp-od-noeh"

[[unit]]
unit = "bytehuffman"
source = "src/Codec/ByteHuffman.cpp"
flags = "cpp-od"

[[unit]]
unit = "bytehuffmannode"
source = "src/Codec/ByteHuffmanNode.cpp"
flags = "cpp-od-noeh"

[[unit]]
unit = "dib"
source = "src/Graphics/Dib.cpp"
flags = "cpp"

[[unit]]
unit = "pixmap"
source = "src/Graphics/PixMap.cpp"
flags = "cpp"

[[unit]]
unit = "directxexception"
source = "src/DirectX/DirectXException.cpp"
flags = "cpp"
