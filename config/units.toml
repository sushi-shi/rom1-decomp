[build]
compiler = "msvc5.0-unresolved"
platform = "win32"
bootstrap = true

# Exact Gruntz profile schema. These are calibration candidates until the
# compiler census and per-TU witnesses select the retail flags.
[flags]
c             = ["/nologo", "/c", "/O2", "/MT"]
cpp           = ["/nologo", "/c", "/O2", "/MT", "/GX"]
cpp-rtti      = ["/nologo", "/c", "/O2", "/MT", "/GX", "/GR"]
cpp-rtti-noeh = ["/nologo", "/c", "/O2", "/MT", "/GR"]
cpp-noeh      = ["/nologo", "/c", "/O2", "/MT"]
